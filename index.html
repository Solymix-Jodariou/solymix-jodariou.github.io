<!doctype html>

    <script>
      // Garde la page demandée : /Gaulois-V2/classement/ devient /classement/. Le reste mène à l'accueil.

      var path = found ? found[1] || "/" : "/";
      location.replace("https://les-gaulois.github.io" + path + location.search + location.hash);
    </script>

        text-align: center;
      }

      }
    </style>
  </head>
